spring.application.name=codechella

spring.r2dbc.url=r2dbc:postgresql://localhost:5432/codechella?sslmode=disable
spring.r2dbc.username=${DB_USERNAME:postgres}
spring.r2dbc.password=${DB_PASSWORD:123456}

spring.flyway.url=jdbc:postgresql://localhost:5432/codechella?sslmode=disable
spring.flyway.user=${DB_USERNAME:postgres}
spring.flyway.password=${DB_PASSWORD:123456}
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=false

deepl.api.key=${DEEPL_APIKEY}
